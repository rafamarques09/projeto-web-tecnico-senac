<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar | CastraPet</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="centro">
        <div class="cartao">
            <h1>CastraPet</h1>
            <p class="subtitulo">Entre para acompanhar a castração do seu animal.</p>
            <form id="form-login">
                <label for="email">E-mail</label>
                <input type="email" id="email" required autocomplete="email">
                <label for="senha">Senha</label>
                <input type="password" id="senha" required autocomplete="current-password">
                <button type="submit">Entrar</button>
                <p id="mensagem" class="mensagem" role="alert"></p>
            </form>
            <p class="rodape-form">Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
        </div>
    </div>
    <script src="js/auth.js"></script>
    <script src="js/login.js"></script>
</body>

</html>
